<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>digital clock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
    #clock {
        font-size: 48px;
    
    }
</style>

</head>
<body>
    <h1>Digital Clock</h1>
    <div id="clock">00:00:00</div>
    <script>
        function showtime() {
            var date = new Date();
            var h = date.getHours();
            var m = date.getMinutes();
            var s = date.getSeconds();
            h = (h < 10) ? "0" + h : h;
            m = (m < 10) ? "0" + m : m;
            s = (s < 10) ? "0" + s : s;
            document.getElementById("clock").innerHTML = h + ":" + m + ":" + s;
        }
        showtime();
        setInterval(showtime, 1000);
    </script>
</body>

</html>
